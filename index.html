<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EcoRuta · Planificador de salida</title>
</head>
<body>
  <main>
    <h1>EcoRuta</h1>
    <p>Planificador de salida al campus</p>

    <form id="plan" novalidate>
      <p>
        <label for="hora-clase">Hora de inicio de mi primera clase</label>
        <input id="hora-clase" type="time" required aria-describedby="error-hora">
      </p>
      <p id="error-hora" role="alert"></p>
      <p><output id="resumen-hora" for="hora-clase"></output></p>

      <p>
        <label for="duracion">Duración habitual del viaje (minutos)</label>
        <input id="duracion" type="number" min="1" step="1" required
               aria-describedby="error-duracion">
      </p>
      <p id="error-duracion" role="alert"></p>
      <p><output id="resumen-duracion" for="duracion"></output></p>

      <p>
        <label for="hora-disponible">Hora más temprana a la que puedo salir (opcional)</label>
        <input id="hora-disponible" type="time">
      </p>
      <p><output id="resumen-disponibilidad" for="hora-disponible"></output></p>

      <button type="submit">Continuar al cálculo</button>
      <p><output id="recomendacion-salida" for="hora-clase duracion"></output></p>
      <p><output id="llegada-estimada" for="hora-clase duracion hora-disponible"></output></p>
      <p><output id="margen-llegada" for="hora-clase duracion hora-disponible"></output></p>
    </form>
  </main>

  <script>
    const plan = document.querySelector("#plan");
    const horaClase = document.querySelector("#hora-clase");
    const duracion = document.querySelector("#duracion");
    const horaDisponible = document.querySelector("#hora-disponible");
    const errorHora = document.querySelector("#error-hora");
    const errorDuracion = document.querySelector("#error-duracion");
    const resumenHora = document.querySelector("#resumen-hora");
    const resumenDuracion = document.querySelector("#resumen-duracion");
    const resumenDisponibilidad = document.querySelector("#resumen-disponibilidad");
    const recomendacionSalida = document.querySelector("#recomendacion-salida");
    const llegadaEstimada = document.querySelector("#llegada-estimada");
    const avisoMargen = document.querySelector("#margen-llegada");
    const margenSalida = 10;
    const minutosPorDia = 24 * 60;

    function horaEnMinutos(hora) {
      const [horas, minutos] = hora.split(":").map(Number);
      return horas * 60 + minutos;
    }

    function formatearHora(minutosTotales) {
      const minutosDelDia = ((minutosTotales % minutosPorDia) + minutosPorDia) % minutosPorDia;
      const horas = Math.floor(minutosDelDia / 60);
      const minutos = minutosDelDia % 60;
      const hora = [horas, minutos].map(parte => String(parte).padStart(2, "0")).join(":");
      const dia = Math.floor(minutosTotales / minutosPorDia);

      if (dia === -1) return `${hora} (día anterior)`;
      if (dia < -1) return `${hora} (${-dia} días antes)`;
      if (dia === 1) return `${hora} (día siguiente)`;
      if (dia > 1) return `${hora} (${dia} días después)`;
      return hora;
    }

    horaClase.addEventListener("input", () => {
      errorHora.textContent = "";
      recomendacionSalida.textContent = "";
      horaClase.removeAttribute("aria-invalid");
      resumenHora.textContent = horaClase.value
        ? `Hora de inicio de clase: ${horaClase.value}`
        : "";
    });

    duracion.addEventListener("input", () => {
      errorDuracion.textContent = "";
      recomendacionSalida.textContent = "";
      duracion.removeAttribute("aria-invalid");
      resumenDuracion.textContent = duracion.validity.valid
        ? `Duración habitual: ${duracion.value} minutos`
        : "";
    });

    horaDisponible.addEventListener("input", () => {
      resumenDisponibilidad.textContent = horaDisponible.value
        ? `Hora más temprana de salida: ${horaDisponible.value}`
        : "";
    });

    plan.addEventListener("input", () => {
      llegadaEstimada.textContent = "";
      avisoMargen.textContent = "";
    });

    plan.addEventListener("submit", (event) => {
      event.preventDefault();

      if (!horaClase.value) {
        errorHora.textContent = "Ingresa la hora de inicio de tu primera clase.";
        horaClase.setAttribute("aria-invalid", "true");
        horaClase.focus();
        return;
      }

      if (!duracion.validity.valid) {
        errorDuracion.textContent = "Ingresa una duración mayor que cero en minutos enteros.";
        duracion.setAttribute("aria-invalid", "true");
        duracion.focus();
        return;
      }

      resumenHora.textContent = `Hora de inicio de clase confirmada: ${horaClase.value}`;
      resumenDuracion.textContent = `Duración habitual: ${duracion.value} minutos`;

      const minutosClase = horaEnMinutos(horaClase.value);
      const minutosViaje = duracion.valueAsNumber;
      const minutosSalida = minutosClase - minutosViaje - margenSalida;

      recomendacionSalida.textContent =
        `Hora recomendada de salida: ${formatearHora(minutosSalida)}` +
        ` con ${margenSalida} minutos de margen.`;

      const minutosLlegada = horaDisponible.value
        ? horaEnMinutos(horaDisponible.value) + minutosViaje
        : minutosClase - margenSalida;
      const detalleLlegada = horaDisponible.value ? "" : " (si sales a la hora recomendada)";

      llegadaEstimada.textContent =
        `Hora estimada de llegada: ${formatearHora(minutosLlegada)}${detalleLlegada}.`;

      const margenLlegada = minutosClase - minutosLlegada;
      const unidad = Math.abs(margenLlegada) === 1 ? "minuto" : "minutos";

      if (margenLlegada > 0) {
        const tipo = margenLlegada >= margenSalida ? "suficiente" : "reducido";
        avisoMargen.textContent =
          `Tienes un margen ${tipo} de ${margenLlegada} ${unidad} antes de clase.`;
      } else if (margenLlegada === 0) {
        avisoMargen.textContent = "Llegarías justo al inicio de clase, con 0 minutos de margen.";
      } else {
        avisoMargen.textContent =
          `Llegarías ${-margenLlegada} ${unidad} después del inicio de clase.`;
      }
    });
  </script>
</body>
</html>
